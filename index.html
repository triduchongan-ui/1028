<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>個人與專案頁面</title>

<style>

* {

margin: 0;

padding: 0;

box-sizing: border-box;

font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

}

body {

background-color: #0f172a;

color: #f8fafc;

display: flex;

justify-content: center;

align-items: center;

min-height: 100vh;

padding: 20px;

}

.container {

background: #1e293b;

padding: 40px;

border-radius: 16px;

box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);

max-width: 550px;

width: 100%;

text-align: center;

border: 1px solid #334155;

}

.avatar {

width: 96px;

height: 96px;

border-radius: 50%;

background: linear-gradient(135deg, #0ea5e9, #6366f1);

display: flex;

align-items: center;

justify-content: center;

font-size: 32px;

font-weight: bold;

margin: 0 auto 20px;

box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);

}

h1 {

font-size: 26px;

margin-bottom: 8px;

color: #ffffff;

}

p.subtitle {

color: #38bdf8;

font-size: 15px;

margin-bottom: 20px;

font-weight: 500;

}

p.description {

color: #94a3b8;

font-size: 14px;

line-height: 1.6;

margin-bottom: 28px;

}

.skills {

display: flex;

gap: 8px;

justify-content: center;

flex-wrap: wrap;

margin-bottom: 30px;

}

.skill-tag {

background: #334155;

color: #e2e8f0;

padding: 6px 14px;

border-radius: 20px;

font-size: 13px;

font-weight: 500;

}

.actions {

display: flex;

gap: 12px;

justify-content: center;

}

.btn {

background: #0284c7;

color: #ffffff;

padding: 12px 24px;

border-radius: 8px;

text-decoration: none;

font-weight: 600;

font-size: 14px;

transition: all 0.2s ease;

}

.btn:hover {

background: #0369a1;

transform: translateY(-2px);

}

.btn-outline {
background: transparent;

border: 1px solid #475569;

color: #cbd5e1;

}

.btn-outline:hover {
background: #334155;

color: #ffffff;

}
</style>

</head>

<body>

<div class="container">

<div class="avatar">DEV</div>

<h1>Nguyen Tri Duc</h1>

<p class="subtitle">電腦科學與人工智慧研究員</p>

<p class="description">歡迎造訪我在 GitHub 上的原始碼倉庫。 </p> 本專案包含個人介面、技術應用模擬和軟體開發研究。

<div class="skills">

<span class="skill-tag">Python</span>

<span class="skill-tag">電腦視覺</span>

<span class="skill-tag">OpenCV</span>

<span class="skill-tag">HTML/CSS</span>

</div>

<div class="actions">

<a href="https://github.com" class="btn" target="_blank">GitHub 個人資料</a>

<a href="#contact" class="btn btn-outline">聯絡我們</a>

</div>

</div>

</body>

</html>
